<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Transsafety Minimal </title>
    <link rel="stylesheet" type="text/css" href="master.css">
    <script type="module" src="core-linker.js"></script>
    <script type="module" src="safe-form.js"> </script>
    <link rel="manifest" href="app.webmanifest" />
    <script type="text/javascript">
        if(navigator && navigator.serviceWorker)
            navigator.serviceWorker.register("service-worker.js");
    </script>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <a id="safe-backup-nav" href="backup/"> <p> Backup Safes </p> </a>
    <form id="safe-form" >
        <div id="header">
            <h1> Transsafety Minimal </h1>
        </div>
        <label for="safe-service"> Service: </label>
        <input required id="safe-service" placeholder="Required..." type="text" />
        <label for="safe-user"> User: </label>
        <input id="safe-user" placeholder="Optional..." type="text" />
        <label for="safe-master-key"> Master-Key: </label>
        <input required id="safe-master-key" placeholder="Required..." type="password" />
        <input id="safe-submit" type="submit" value="Submit" /> 
    </div>
</body>
</html>
